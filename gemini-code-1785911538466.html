<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M88888888 欒帥資訊牆 - MediaPipe 粒子互動偵測系統</title>
  
  <!-- MediaPipe & Camera Utils CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
      color: #f3f4f6;
    }

    /* 全螢幕背景粒子 Canvas */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI 頂部標題列 */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .header-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(129, 140, 248, 0.3);
    }

    .header-datetime {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4ade80;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 攝影機與骨架顯示區 (畫中畫 HUD) */
    .video-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 320px;
      height: 240px;
      z-index: 10;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    #inputVideo {
      display: none; /* 隱藏原生 Video 標籤，透過 Canvas 繪製 */
    }

    #cameraCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡像顯示 */
    }

    .camera-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #e5e7eb;
      letter-spacing: 0.5px;
    }

    /* 左側狀態控制面板 */
    .status-panel {
      position: absolute;
      top: 94px;
      left: 24px;
      width: 300px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
