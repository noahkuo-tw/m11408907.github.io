<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M88888888 欒帥資訊牆 - MediaPipe 粒子互動系統</title>
  
  <!-- 引入 MediaPipe 官方 JS CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #ffffff;
    }

    /* 全螢幕背景粒子 Canvas */
    #particle_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 頂部資訊 Bar */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-datetime {
      font-family: monospace;
      font-size: 16px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* 右下角視訊與偵測骨架繪製視窗 */
    .webcam-hud {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 240px;
      z-index: 10;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 2px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    #webcam_canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡像顯示 */
    }

    .hud-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #38bdf8;
    }

    /* 左側狀態儀表板 */
    .dashboard {
      position: absolute;
      top: 85px;
      left: 20px;
      width: 280px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
    }

    .dash-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .dash-label {
      color: #9ca3af;
    }

    .dash-value {
      font-weight: bold;
      color: #38bdf8;
    }

    .dash-value.open {
      color: #4ade80;
    }

    .dash-value.closed {
      color: #f87171;
    }
  </style>
</head>
<body>

  <!-- 頂部資訊頁首 -->
  <header>
    <div class="header-title">M88888888 欒帥資訊牆</div>
    <div class="header-datetime" id="datetimeText">2026/08/05 00:00:00</div>
  </header>

  <!-- 全螢幕粒子背景 Canvas -->
  <canvas id="particle_canvas"></canvas>

  <!-- 左側狀態儀表板 -->
  <div class="dashboard">
    <div style="font-weight:bold; margin-bottom:12px; color:#f3f4f6; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:6px;">
      ✋ 右手偵測與粒子狀態
    </div>
    <div class="dash-row">
      <span class="dash-label">右手偵測：</span>
      <span class="dash-value" id="valHandState">搜尋右手中...</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">手掌動作：</span>
      <span class="dash-value" id="valGesture">未偵測</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">螢幕距離 (縮放)：</span>
      <span class="dash-value" id="valDistance">1.00x</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">當前圖形：</span>
      <span class="dash-value" id="valShape">❤️ 愛心</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">色彩風格：</span>
      <span class="dash-value" id="valColor">賽博霓虹</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">握合切換次數：</span>
      <span class="dash-value" id="valFistCount">0 次</span>
    </div>
  </div>

  <!-- 右下角鏡頭與骨架預覽 HUD -->
  <div class="webcam-hud">
    <video id="input_video" playsinline style="display:none;"></video>
    <canvas id="webcam_canvas"></canvas>
    <div class="hud-tag">📹 MediaPipe 實體畫面與偵測</div>
  </div>

  <!-- JavaScript 邏輯程式碼 -->
  <script>
    // --- 1. 時間即時更新 ---
    function updateClock() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, '0');
      var d = String(now.getDate()).padStart(2, '0');
      var hh = String(now.getHours()).padStart(2, '0');
      var mm = String(now.getMinutes()).padStart(2, '0');
      var ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('datetimeText').textContent = y + '/' + m + '/' + d + ' ' + hh + ':' + mm + ':' + ss;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 2. 粒子系統與形狀生成 (Particle Engine) ---
    var pCanvas = document.getElementById('particle_canvas');
    var pCtx = pCanvas.getContext('2d');
    var width = pCanvas.width = window.innerWidth;
    var height = pCanvas.height = window.innerHeight;

    window.addEventListener('resize', function() {
      width = pCanvas.width = window.innerWidth;
      height = pCanvas.height = window.innerHeight;
      buildShape(currentShapeIdx);
    });

    var PARTICLE_COUNT = 1200;
    var particles = [];

    var SHAPES = [
      { name: '❤️ 愛心' },
      { name: '⭐ 星星' },
      { name: '🌸 花朵' },
      { name: '🪐 土星光環' },
      { name: '🌀 雙螺旋' }
    ];

    var PALETTES = [
      { name: '賽博霓虹', colors: ['#00f2fe', '#4facfe', '#f093fb', '#f5576c', '#5ee7df'] },
      { name: '璀璨金耀', colors: ['#ffe066', '#f72585', '#7209b7', '#4cc9f0', '#ffb703'] },
      { name: '翡翠極光', colors: ['#10b981', '#34d399', '#059669', '#6ee7b7', '#a7f3d0'] },
      { name: '熾焰熔岩', colors: ['#ef4444', '#f97316', '#f59e0b', '#dc2626', '#b91c1c'] },
      { name: '夢幻星空', colors: ['#a855f7', '#ec4899', '#6366f1', '#8b5cf6', '#d8b4fe'] },
      { name: '電光琉璃', colors: ['#06b6d4', '#3b82f6', '#1d4ed8', '#60a5fa', '#93c5fd'] }
    ];

    var currentShapeIdx = 0;
    var currentPaletteIdx = 0;
    var fistTriggerCount = 0;
    var isFistClosed = false;
    var lastFistState = false;
    var distanceScale = 1.0;
    var isRightHandFound = false;

    function ParticleObj() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.baseX = this.x;
      this.baseY = this.y;
      this.size = Math.random() * 2.5 + 1.5;
      this.color = '#38bdf8';
    }

    ParticleObj.prototype.update = function() {
      var centerX = width / 2;
      var centerY = height / 2;

      var targetX = centerX + (this.baseX - centerX) * distanceScale;
      var targetY = centerY + (this.baseY - centerY) * distanceScale;

      if (isFistClosed) {
        // 握合時：粒子縮起來收攏至中心
        targetX = centerX + (this.baseX - centerX) * 0.15 * distanceScale;
        targetY = centerY + (this.baseY - centerY) * 0.15 * distanceScale;
      } else {
        // 張開時：粒子放大發散飄動
        targetX += Math.sin(Date.now() * 0.002 + this.size) * 12;
        targetY += Math.cos(Date.now() * 0.002 + this.size) * 12;
      }

      this.x += (targetX - this.x) * 0.08;
      this.y += (targetY - this.y) * 0.08;
    };

    ParticleObj.prototype.draw = function(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color;
      ctx.fill();
    };

    for (var i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new ParticleObj());
    }

    function buildShape(shapeIdx) {
      var centerX = width / 2;
      var centerY = height / 2;
      var minDim = Math.min(width, height) * 0.35;
      var palette = PALETTES[currentPaletteIdx].colors;

      for (var i = 0; i < PARTICLE_COUNT; i++) {
        var p = particles[i];
        var t = (i / PARTICLE_COUNT) * Math.PI * 2;
        var tx = 0, ty = 0;

        switch (shapeIdx) {
          case 0: // 愛心
            var angle = t * 2;
            var r = minDim * 0.04;
            tx = 16 * Math.pow(Math.sin(angle), 3);
            ty = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
            tx = tx * r + (Math.random() - 0.5) * 15;
            ty = ty * r + (Math.random() - 0.5) * 15;
            break;

          case 1: // 五角星
            var starPoints = 5;
            var a = t * starPoints;
            var innerR = minDim * 0.4;
            var outerR = minDim * 0.85;
            var radius = innerR + (outerR - innerR) * Math.pow(Math.abs(Math.sin(a * 2.5)), 2);
            tx = radius * Math.cos(t);
            ty = radius * Math.sin(t);
            break;

          case 2: // 花朵
            var k = 6;
            var radius = minDim * (0.3 + 0.6 * Math.abs(Math.cos(k * t / 2)));
            tx = radius * Math.cos(t);
            ty = radius * Math.sin(t);
            break;

          case 3: // 土星光環
            if (i < PARTICLE_COUNT * 0.3) {
              var phi = Math.acos(2 * Math.random() - 1);
              var theta = 2 * Math.PI * Math.random();
              var radius = minDim * 0.35 * Math.cbrt(Math.random());
              tx = radius * Math.sin(phi) * Math.cos(theta);
              ty = radius * Math.sin(phi) * Math.sin(theta);
            } else {
              var ringR = minDim * (0.65 + Math.random() * 0.3);
              var ringA = t * 3;
              var rx = ringR * Math.cos(ringA);
              var ry = ringR * 0.3 * Math.sin(ringA);
              var tilt = 0.45;
              tx = rx * Math.cos(tilt) - ry * Math.sin(tilt);
              ty = rx * Math.sin(tilt) + ry * Math.cos(tilt);
            }
            break;

          case 4: // 雙螺旋
            var turns = 4;
            var a = t * turns * Math.PI;
            var strand = (i % 2 === 0) ? 1 : -1;
            var radius = minDim * 0.6;
            var len = (i / PARTICLE_COUNT - 0.5) * minDim * 1.6;
            tx
